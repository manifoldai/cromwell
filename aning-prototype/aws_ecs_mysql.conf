include required(classpath("application.conf"))

# AWS Configuration
aws {
  application-name = "cromwell"
  auths = [
    {
      name = "default"
      scheme = "default"
    }
  ]
  region = ${?AWS_DEFAULT_REGION}
}

# Database Configuration for Aurora Serverless v2 (MySQL)
database {
  profile = "slick.jdbc.MySQLProfile$"
  db {
    driver = "com.mysql.cj.jdbc.Driver"
    
    # Build JDBC URL from environment variables
    # Aurora endpoint format: cluster-name.cluster-xxx.region.rds.amazonaws.com
    url = "jdbc:mysql://"${?AURORA_ENDPOINT}":"${?AURORA_PORT}"/"${?AURORA_DB_NAME}"?rewriteBatchedStatements=true&useSSL=true&serverTimezone=UTC&useInformationSchema=true"
    
    user = ${?AURORA_USERNAME}
    password = ${?AURORA_PASSWORD}
    
    # Connection pool settings optimized for Aurora Serverless v2
    connectionTimeout = 5000
    numThreads = ${?DB_POOL_SIZE}      # Default: 10
    maxConnections = ${?DB_MAX_CONNECTIONS}  # Default: 10
    
    # Aurora Serverless v2 can scale, so we can use more connections
    # Recommended: Start with 10-20 and adjust based on ACU scaling
  }
  
  # Batch insert optimization
  insert-batch-size = ${?DB_INSERT_BATCH_SIZE}  # Default: 2000
}

# Engine Configuration
engine {
  filesystems {
    s3 {
      auth = "default"
    }
  }
}

# Backend Configuration
backend {
  default = "AWSBATCH"
  providers {
    AWSBATCH {
      actor-factory = "cromwell.backend.impl.aws.AwsBatchBackendLifecycleActorFactory"
      config {
        # S3 root for execution outputs
        root = ${?CROMWELL_EXECUTION_ROOT}  # e.g., "s3://my-cromwell-bucket/executions"
        auth = "default"
        
        # Job submission configuration
        numSubmitAttempts = 6
        numCreateDefinitionAttempts = 6
        concurrent-job-limit = ${?CONCURRENT_JOB_LIMIT}  # Default: 24
        
        # AWS Batch configuration
        default-runtime-attributes {
          queueArn: ${?AWS_BATCH_QUEUE_ARN}
          scriptBucketName: ${?AWS_BATCH_SCRIPT_BUCKET}
        }
        
        # Filesystem configuration
        filesystems {
          s3 {
            auth = "default"
            caching {
              duplication-strategy = "copy"
            }
          }
        }
        
        # Job monitoring
        slow-job-warning-time: 24 hours
      }
    }
  }
}

# Webservice configuration
webservice {
  port = 8000
  interface = 0.0.0.0
  binding-timeout = 5s
  instance.name = ${?CROMWELL_INSTANCE_NAME}  # e.g., "cromwell-prod"
}

# Workflow options
workflow-options {
  workflow-log-dir = ${?CROMWELL_WORKFLOW_LOGS_DIR}  # e.g., "s3://my-cromwell-bucket/logs"
  workflow-log-temporary = false
}

# System configuration
system {
  abort-jobs-on-terminate = false
  graceful-server-shutdown = true
  
  # Concurrent workflow limits
  max-concurrent-workflows = ${?MAX_CONCURRENT_WORKFLOWS}  # Default: 10
  max-workflow-launch-count = ${?MAX_WORKFLOW_LAUNCH_COUNT}  # Default: 50
  
  # I/O configuration
  io {
    number-of-attempts = 5
    per-request-timeout = 60 seconds
  }
}

# Call caching configuration
call-caching {
  enabled = ${?ENABLE_CALL_CACHING}  # Default: true
  
  invalidate-bad-cache-results = true
  lookup-docker-hash = true
  hashing-strategy = "XXHASH64"
  
  write-to-cache = ${?WRITE_TO_CACHE}  # Default: true
  read-from-cache = ${?READ_FROM_CACHE}  # Default: true
}

# Metadata configuration
metadata {
  # Metadata archival is only supported for Google Cloud Storage (GCS)
  # For AWS deployments, archival must be disabled
  archive-status = "Unarchived"
  
  # Alternative approaches for AWS metadata management:
  # 1. Use Aurora automated backups and point-in-time recovery
  # 2. Implement external archival via Lambda + Cromwell API
  # 3. Configure database-level retention policies
  # 4. Use Aurora Serverless v2 auto-scaling to handle metadata growth
}