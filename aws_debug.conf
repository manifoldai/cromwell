include required(classpath("application.conf"))

# AWS Configuration - reads from environment variables
aws {
  application-name = "cromwell"
  auths = [
    {
      name = "default"
      scheme = "default"
    }
  ]
  region = ${?AWS_DEFAULT_REGION}
}

# Use in-memory database to avoid MySQL dependency
database {
  profile = "slick.jdbc.HsqldbProfile$"
  db {
    driver = "org.hsqldb.jdbcDriver"
    url = "jdbc:hsqldb:mem:cromwell_test;shutdown=false;hsqldb.tx=mvcc"
    user = "sa"
    password = ""
    connectionTimeout = 5000
    numThreads = 1
  }
}

# Engine Configuration
engine {
  filesystems {
    s3 {
      auth = "default"
    }
  }
}

# Backend Configuration
backend {
  default = "AWSBATCH"
  providers {
    AWSBATCH {
      actor-factory = "cromwell.backend.impl.aws.AwsBatchBackendLifecycleActorFactory"
      config {
        # Root execution directory (using your actual bucket)
        root = "s3://al-test-cloudfront-logs/cromwell-executions"
        auth = "default"
        
        # Job submission configuration
        numSubmitAttempts = 6
        numCreateDefinitionAttempts = 6
        concurrent-job-limit = 24
        
        # Default runtime attributes
        default-runtime-attributes {
          queueArn: ${?AWS_BATCH_QUEUE_ARN}
          scriptBucketName: ${?AWS_BATCH_SCRIPT_BUCKET}
        }
        
        # Filesystem configuration
        filesystems {
          s3 {
            auth = "default"
            caching {
              duplication-strategy = "copy"
            }
          }
        }
        
        # Job monitoring
        slow-job-warning-time: 24 hours
      }
    }
  }
}

# Minimal webservice configuration
webservice {
  port = 8000
  interface = 0.0.0.0
  binding-timeout = 5s
  instance.name = "reference"
}

# Minimal workflow options
workflow-options {
  workflow-log-dir = ${?CROMWELL_WORKFLOW_LOGS_DIR}
  workflow-log-temporary = false
}

# Minimal system configuration
system {
  abort-jobs-on-terminate = false
  graceful-server-shutdown = true
  
  # Reduce memory usage for debugging
  max-concurrent-workflows = 10
  max-workflow-launch-count = 50
  
  # Reduce I/O load
  io {
    # Reduce number of attempts for file operations
    number-of-attempts = 3
    # Reduce per-request timeout
    per-request-timeout = 30 seconds
  }
}

# Minimal call caching (disabled for debugging)
call-caching {
  enabled = false
}

# Minimal metadata configuration
metadata {
  # Disable metadata archival for debugging
  archive-status = "Off"
}